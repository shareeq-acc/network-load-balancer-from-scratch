<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load Balancer Simulator</title>
  <style>
    :root {
      --bg: #07071a;
      --surface: #0e0e2a;
      --surface2: #14143a;
      --border: rgba(120,120,255,0.12);
      --accent: #6366f1;
      --accent2: #818cf8;
      --success: #22d3a0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --muted: #64748b;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    header .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(99,102,241,0.15);
      color: var(--accent2);
      border: 1px solid rgba(99,102,241,0.3);
    }

    /* ── Layout ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 12px;
      gap: 20px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Algorithm */
    .algo-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 4px;
    }
    .algo-btn .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .algo-btn:hover { background: var(--surface2); color: var(--text); }
    .algo-btn.active {
      background: rgba(99,102,241,0.15);
      border-color: rgba(99,102,241,0.4);
      color: var(--accent2);
    }
    .algo-btn.active .dot { background: var(--accent2); }

    /* Simulation */
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type=number], input[type=text] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
    }
    input[type=number]:focus, input[type=text]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 6px; }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent2); }

    /* Stats */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row .key { color: var(--muted); }
    .stat-row .val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-row .val.green { color: var(--success); }
    .stat-row .val.red { color: var(--danger); }
    .stat-row .val.blue { color: var(--accent2); }

    /* ── Canvas ── */
    #canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(99,102,241,0.06) 0%, transparent 60%),
        linear-gradient(rgba(120,120,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,120,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* SVG overlay */
    #svg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .conn-line {
      stroke-width: 1.5;
      fill: none;
      stroke: rgba(99,102,241,0.25);
      transition: stroke 0.3s;
    }
    .conn-line.active {
      stroke: rgba(99,102,241,0.8);
      stroke-width: 2;
      filter: drop-shadow(0 0 4px rgba(99,102,241,0.6));
    }
    .conn-line.dead {
      stroke: rgba(239,68,68,0.2);
      stroke-dasharray: 6 4;
    }

    /* ── LB Node ── */
    #lb-node {
      position: absolute;
      width: 110px;
      padding: 14px 12px 12px;
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(167,139,250,0.15));
      border: 1.5px solid rgba(99,102,241,0.5);
      border-radius: 14px;
      text-align: center;
      cursor: default;
      user-select: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(99,102,241,0.2), inset 0 1px 0 rgba(255,255,255,0.07);
      transform: translate(-50%, -50%);
      z-index: 5;
      transition: box-shadow 0.2s;
    }
    #lb-node.routing {
      box-shadow: 0 0 30px rgba(99,102,241,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    #lb-node .lb-icon { font-size: 22px; margin-bottom: 4px; }
    #lb-node .lb-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent2); }
    #lb-node .lb-algo { font-size: 9px; color: var(--muted); margin-top: 2px; }

    /* ── Client Node ── */
    #client-node {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }
    #client-node .c-icon {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(34,211,160,0.15), rgba(34,211,160,0.08));
      border: 1.5px solid rgba(34,211,160,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      margin: 0 auto 4px;
      box-shadow: 0 0 14px rgba(34,211,160,0.15);
    }
    #client-node .c-label { font-size: 10px; color: var(--muted); }

    /* ── Server Nodes ── */
    .server-node {
      position: absolute;
      width: 130px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: grab;
      user-select: none;
      transform: translate(-50%, -50%);
      z-index: 5;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(6px);
    }
    .server-node:active { cursor: grabbing; }
    .server-node.healthy {
      border-color: rgba(34,211,160,0.35);
      box-shadow: 0 0 12px rgba(34,211,160,0.08);
    }
    .server-node.dead {
      border-color: rgba(239,68,68,0.35);
      box-shadow: 0 0 12px rgba(239,68,68,0.08);
      opacity: 0.7;
    }
    .server-node.processing {
      box-shadow: 0 0 18px rgba(var(--node-r),var(--node-g),var(--node-b),0.4);
    }
    .server-node .node-header {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .server-node .node-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.3s;
    }
    .server-node.healthy .node-dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .server-node.dead .node-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
    .server-node .node-name { font-size: 11px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .server-node .node-color-bar {
      width: 100%; height: 2px; border-radius: 2px; margin-bottom: 7px;
    }
    .node-stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 7px;
    }
    .node-stat { background: var(--surface); border-radius: 5px; padding: 4px 5px; }
    .node-stat .ns-label { font-size: 9px; color: var(--muted); margin-bottom: 1px; }
    .node-stat .ns-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .node-actions { display: flex; gap: 4px; }
    .node-actions button {
      flex: 1; font-size: 10px; padding: 4px 0; border-radius: 5px; border: none; cursor: pointer; font-weight: 600; transition: all 0.15s;
    }
    .btn-kill-node { background: rgba(239,68,68,0.15); color: var(--danger); }
    .btn-kill-node:hover { background: rgba(239,68,68,0.3); }
    .btn-kill-node.revive { background: rgba(34,211,160,0.15); color: var(--success); }
    .btn-kill-node.revive:hover { background: rgba(34,211,160,0.3); }
    .btn-rm-node { background: rgba(100,116,139,0.15); color: var(--muted); }
    .btn-rm-node:hover { background: rgba(239,68,68,0.2); color: var(--danger); }

    /* ── Request packets ── */
    .packet {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px currentColor;
    }

    /* ── Add Server Modal ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 300px;
    }
    #modal-box h3 { font-size: 14px; margin-bottom: 16px; }
    .modal-close {
      float: right; background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; margin-top: -4px;
    }
    .modal-close:hover { color: var(--text); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 16px; font-size: 12px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <h1>Load Balancer Simulator</h1>
  <span class="badge" id="header-badge">Round Robin</span>
</header>

<div class="workspace">

  <!-- Sidebar -->
  <aside>
    <!-- Algorithm -->
    <div>
      <div class="section-title">Algorithm</div>
      <button class="algo-btn active" data-algo="round-robin">
        <span class="dot"></span> Round Robin
      </button>
      <button class="algo-btn" data-algo="weighted-round-robin">
        <span class="dot"></span> Weighted Round Robin
      </button>
      <button class="algo-btn" data-algo="least-connections">
        <span class="dot"></span> Least Connections
      </button>
    </div>

    <!-- Simulation -->
    <div>
      <div class="section-title">Simulation</div>
      <label>Number of requests</label>
      <input type="number" id="req-count" value="10" min="1" max="200" />
      <label>Delay between requests (ms)</label>
      <input type="number" id="req-delay" value="300" min="50" max="3000" />
      <label>Processing time (ms)</label>
      <input type="number" id="proc-time" value="1500" min="200" max="8000" />
      <button class="btn btn-primary" id="btn-simulate">▶ Simulate</button>
      <button class="btn btn-secondary" id="btn-stop" disabled>⏹ Stop</button>
    </div>

    <!-- Add Server -->
    <div>
      <div class="section-title">Servers</div>
      <button class="btn btn-secondary" id="btn-add-server">+ Add Server</button>
    </div>

    <!-- Stats -->
    <div>
      <div class="section-title">Stats</div>
      <div id="stats-panel">
        <div class="stat-row">
          <span class="key">Total Requests</span>
          <span class="val blue" id="stat-total">0</span>
        </div>
        <div class="stat-row">
          <span class="key">Servers Up</span>
          <span class="val green" id="stat-alive">0</span>
        </div>
        <div class="stat-row">
          <span class="key">Servers Down</span>
          <span class="val red" id="stat-dead">0</span>
        </div>
        <div class="stat-row">
          <span class="key">In Flight</span>
          <span class="val" id="stat-inflight">0</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Canvas -->
  <main id="canvas-area">
    <svg id="svg-layer"></svg>
    <div id="client-node">
      <div class="c-icon">🌐</div>
      <div class="c-label">Internet</div>
    </div>
    <div id="lb-node">
      <div class="lb-icon">⚡</div>
      <div class="lb-label">Load Balancer</div>
      <div class="lb-algo" id="lb-algo-label">Round Robin</div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <h3>Add Server</h3>
    <label>Server URL</label>
    <input type="text" id="modal-url" placeholder="http://localhost:8084" />
    <label>Weight (for Weighted RR)</label>
    <input type="number" id="modal-weight" value="1" min="1" max="10" />
    <button class="btn btn-primary" id="modal-confirm" style="margin-top:4px">Add Server</button>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
